  <!-- start-body:: -->
  <body
    dir="ltr"
    class="min-vh-100 d-flex flex-column"
    style="font-family: 'Figtree', sans-serif"
  >
    <!-- start-Block:: Header-->
    <header class="bg-primary bg-opacity-75 py-3 text-center">
      <h1
        class="text-warning text-capitalize text-opacity-70 display-2 fw-medium m-0"
      >
        🔑 password generator
      </h1>
    </header>
    <!-- end-Block:: Header -->

    <!-- start-Block:: Main-->
    <main class="flex-grow-1 bg-light p-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-6">
            <h2 class="mb-4 text-center text-muted">
              Let's generate your code by determine it's lenght & combined
              characters:
            </h2>

            <form class="row g-3 password-generator-form">
              <div class="input-group">
                <input
                  type="text"
                  name="password"
                  class="form-control"
                  placeholder="Let's Generate password"
                  aria-label="Generated Password"
                  aria-describedby="basic-addon2"
                  readonly
                />
                <div class="input-group-text p-0">
                  <button type="button" class="btn btn-clipboard">
                    <i class="bi bi-clipboard"></i>
                  </button>
                </div>
              </div>

              <div class="row g-3 align-items-center">
                <div class="col">
                  <label
                    for="passwordLength"
                    class="col-form-label text-capitalize"
                    >password length</label
                  >
                </div>
                <div class="col">
                  <input
                    type="number"
                    name="passwordLength"
                    id="passwordLength"
                    class="form-control"
                    value="10"
                    min="4"
                    max="30"
                    aria-labelledby="passwordHelpInline"
                  />
                </div>
                <div class="col-auto">
                  <span id="passwordHelpInline" class="form-text">
                    Must be numbers min:4-> max:30.
                  </span>
                </div>
              </div>

              <div class="col-sm-6">
                <div class="form-check">
                  <input
                    name="passwordType"
                    class="form-check-input"
                    type="checkbox"
                    value="uppercase"
                    id="uppercase"
                  />
                  <label
                    class="form-check-label text-capitalize"
                    for="uppercase"
                  >
                    uppercase
                  </label>
                </div>
              </div>

              <div class="col-sm-6">
                <div class="form-check">
                  <input
                    name="passwordType"
                    class="form-check-input"
                    type="checkbox"
                    value="lowercase"
                    id="lowercase"
                  />
                  <label
                    class="form-check-label text-capitalize"
                    for="lowercase"
                  >
                    lowercase
                  </label>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="form-check">
                  <input
                    name="passwordType"
                    class="form-check-input"
                    type="checkbox"
                    value="numbers"
                    id="numbers"
                  />
                  <label class="form-check-label text-capitalize" for="numbers">
                    numbers
                  </label>
                </div>
              </div>

              <div class="col-sm-6">
                <div class="form-check">
                  <input
                    name="passwordType"
                    class="form-check-input"
                    type="checkbox"
                    value="symbols"
                    id="symbols"
                  />
                  <label class="form-check-label text-capitalize" for="symbols">
                    symbols
                  </label>
                </div>
              </div>

              <button type="submit" class="mt-5 btn btn-primary text-uppercase">
                generate password
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <!-- end-Block:: Main -->

    <!-- start-Block:: Footer -->
    <footer class="bg-dark text-light py-3">
      <p class="mb-0 text-center">
        <span class="current-year">2021</span> ©
        <a
          class="text-reset"
          href="https://amrsaadabdallah.github.io"
          target="_blank"
          >AMR SAAD ABDALLAH</a
        >
      </p>
    </footer>
    <!-- end-Block::Footer -->

    <!-- start-script:: -->
    <script src="assets/js/main.js"></script>
    <!-- end-script:: -->
  </body>
  <!-- end-body:: -->
</html>
