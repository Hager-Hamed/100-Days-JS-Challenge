		<link rel="stylesheet" href="assets/css/reset.css" />

	<!-- start-body:: -->
	<body dir="ltr">
		<!-- start-Block:: Header-->
		<header class="main-header">
			<h1 class="main-header__title" data-text="sadasd">⏰ Countdown Timer</h1>
		</header>
		<!-- end-Block:: Header -->

		<!-- start-Block:: Main-->
		<main>
			<section class="section">
				<!-- <input type="datetime-local" class="datetime" name="" id="" />
				<input type="date" class="datetime" name="" id="" />
				<input type="time" class="datetime" name="" id="" />
				<br /> -->

				<h2 class="timer-message"></h2>

				<div class="row">
					<div class="figure">
						<h3 class="figure__title">Days</h3>
						<span class="figure__number days">00</span>
					</div>

					<span class="seperator"> &colon;</span>
					<div class="figure">
						<h3 class="figure__title">hours</h3>
						<span class="figure__number hours">00</span>
					</div>
					<span class="seperator"> &colon;</span>
					<div class="figure">
						<h3 class="figure__title">minutes</h3>
						<span class="figure__number minutes">00</span>
					</div>
					<span class="seperator"> &colon;</span>
					<div class="figure">
						<h3 class="figure__title">seconds</h3>
						<span class="figure__number seconds">00</span>
					</div>
				</div>
			</section>
		</main>
		<!-- end-Block:: Main -->

		<!-- start-Block:: Footer -->
		<footer class="main-footer">
			<p>
				<span class="current-year">2021</span> ©

					href="https://amrsaadabdallah.github.io"
					target="_blank"
					>AMR SAAD ABDALLAH</a
				>
			</p>
		</footer>
		<!-- end-Block::Footer -->

		<!-- start-script:: -->
		<script src="assets/js/main.js"></script>
		<!-- end-script:: -->
	</body>
