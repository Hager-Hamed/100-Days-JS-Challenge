<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./content/css/style.css" />
    <!-- <link rel="stylesheet" href="css/fontawesome-free-6.1.2-web/css/all.css"> -->
  </head>
  <body>
    <div class="container">
      <div class="forms-container">
        <div class="signin-signup">
          <form action="" class="sign-in-form">
            <h2 class="title">Sign in</h2>
            <div class="input-field form-group fullname">
              <i class="fas fa-user"></i>
              <input type="text" placeholder="UserName" />
            </div>
            <div class="input-field form-group password">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" placeholder="Password" />
              <i id="pass-toggle-btn" class="fa-solid fa-eye"></i>
            </div>
            <div class="form-group submit-btn">
              <input type="submit" value="Login" class="btn solid" />
            </div>

            <p class="social-text">Or Sign in with social Platforms</p>
            <div class="social-media">
              <a href="#" class="social-icon"
                ><i class="fab fa-facebook-f"></i
              ></a>
              <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
              <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
            </div>
          </form>

          <form action="" class="sign-up-form">
            <h2 class="title">Sign up</h2>
            <div class="input-field form-group">
              <i class="fas fa-user"></i>
              <input type="text" placeholder="UserName" />
            </div>

            <div class="input-field form-group">
              <i class="fas fa-envelope"></i>
              <input type="email" placeholder="Email   " />
            </div>

            <div class="input-field form-group">
              <i class="fas fa-lock"></i>
              <input type="password" placeholder="Password" />
            </div>

            <div class="input-field form-group">
              <i class="fas fa-lock"></i>
              <input type="password" placeholder="Password" />
            </div>
            <div class="form-group submit-btn">
              <input type="submit" value="Sign up" class="btn solid" />
            </div>
            <p class="social-text">Or Sign up with social Platforms</p>
            <div class="social-media">
              <a href="#" class="social-icon"
                ><i class="fab fa-facebook-f"></i
              ></a>
              <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
              <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
            </div>
          </form>
        </div>
      </div>

      <div class="panels-container">
        <div class="panel left-panel">
          <div class="content">
            <h3>New here?</h3>
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit.
              Consequatur eos corporis repellendus.
            </p>
            <button class="btn transparent" id="sign-up-btn">Sign up</button>
          </div>

          <img
            src="./content/images/undraw_education_f8ru.svg"
            class="image"
            alt=""
          />
        </div>

        <div class="panel right-panel">
          <div class="content">
            <h3>One of us</h3>
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit.
              Consequatur eos corporis repellendus.
            </p>
            <button class="btn transparent" id="sign-in-btn">Sign in</button>
          </div>

          <img src="./content/images/register.svg" class="image" alt="" />
        </div>
      </div>
    </div>

    <!-- link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="./content/js/main.js"></script>
  </body>
</html>
